[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "model-route"
version = "0.1.0"
description = "An offline, consent-gated contextual model router experiment"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Sidharth Vasudev" }]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
model-route = "model_route.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_route = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
